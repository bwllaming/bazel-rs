[package]
name = "bazel-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
description = "Experimental native Rust foundations for a Bazel-compatible build system"

[dependencies]
allocative = "=0.3.6"
anyhow = "1"
base64 = "=0.22.1"
blake3 = "=1.8.2"
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
fs2 = "0.4"
num-bigint = "=0.4.8"
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "=0.10.6"
sha2 = "0.10"
starlark = "=0.14.2"
tar = { version = "=0.4.46", default-features = false }
tempfile = "=3.27.0"
zip = { version = "=9.0.2", default-features = false, features = ["deflate-flate2"] }

[patch.crates-io]
starlark = { path = "vendor/starlark-0.14.2" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[lints.rust]
unsafe_code = "deny"
