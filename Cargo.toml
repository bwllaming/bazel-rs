[package]
name = "bazel-rs"
version = "0.4.5"
edition = "2024"
rust-version = "1.99"
publish = false
description = "Experimental native Rust foundations for a Bazel-compatible build system"
license = "Apache-2.0"
repository = "https://github.com/bwllaming/bazel-rs"
readme = "README.md"

[dependencies]
allocative = "=0.3.6"
anyhow = "1"
base64 = "=0.22.1"
blake3 = "=1.8.2"
# h2's buffer and request types (crate::grpc_channel); the lock's versions.
bytes = "=1.12.1"
bzip2 = "=0.6.1"
fancy-regex = "=0.16.2"
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
fs2 = "0.4"
# The REAPI v2 gRPC remote cache (crate::grpc_channel, docs/REMOTE_CACHE.md):
# gRPC is HTTP/2 framing plus a 5-byte message prefix and trailers, so the
# client speaks it directly over h2 (MIT) with hand-encoded protobuf like
# crate::reapi; no tonic/prost/protoc. h2's only new transitive crate is
# tokio-util (MIT). tokio (MIT), tokio-rustls, rustls, rustls-pki-types and
# rustls-native-certs (Apache-2.0/MIT/ISC) are the versions reqwest already
# brings; the extra tokio features (multi-thread runtime, TCP/Unix sockets,
# timers) build no new crates.
h2 = "=0.4.20"
http = "=1.5.0"
# Only for the client-side HTTP/1 reason phrase (hyper::ext::ReasonPhrase) that
# Bazel shows in "GET returned CODE REASON"; same version reqwest already uses.
hyper = { version = "=1.12.0", default-features = false }
landlock = "=0.4.7"
lzma-rust2 = { version = "=0.22.0", default-features = false, features = ["std", "optimization", "xz"] }
# sigaction(2) for the interactive progress display (crate::progress): a
# SIGINT/SIGTERM/SIGHUP clears its status area before the signal ends the
# process. Same version the lock already has through std's dependents (no
# new code is built).
libc = "=0.2.190"
# SIMD substring search: the store-path scan of a repository tree rides on
# its hashing read (crate::repository_slots); same version the lock already
# has through regex/aho-corasick (no new code is built).
memchr = "=2.8.3"
num-bigint = "=0.4.8"
# The binary snapshot formats (PLAN-L2 §1d; the user directive: no JSON for
# new stores): serde with varint integers, already in the lock through
# `pagable`; std only (no heapless, no CRC: the store checksums sections).
postcard = { version = "=1.1.3", default-features = false, features = ["use-std"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
ruzstd = "=0.9.1"
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "=0.8.4"
rustls-pki-types = { version = "=1.15.1", features = ["std"] }
# kill(2)/killpg on a child's process group without spawning kill(1) and
# without unsafe code (git_process); renameat2(RENAME_EXCHANGE) for the
# atomic replacement of a published repository tree (repository_store); same
# version tempfile already uses (with "fs" on: no new code is built).
# `stdio`: dup2 onto file descriptor 2 (the analysis snapshot's capture of
# what planning printed, crate::snapshot::capture). `event`: poll(2) on a
# pidfd and the control channel in the spawn supervisor
# (crate::process_wrapper; `process` brings the subreaper prctl, pidfds and
# waitid). `termios`: isatty and the terminal width (TIOCGWINSZ) of the
# interactive progress display (crate::progress).
rustix = { version = "=1.1.5", default-features = false, features = ["std", "process", "stdio", "fs", "event", "termios"] }
# `rc`: the planned request's shared command-line parts (Arc) encode by value.
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "=0.10.6"
sha2 = "0.10"
starlark = "=0.14.2"
tar = { version = "=0.4.46", default-features = false }
tempfile = "=3.27.0"
zip = { version = "=9.0.2", default-features = false, features = ["deflate-flate2"] }
# Process-wide Rust allocator (feature "jemalloc", on by default): linked
# statically with prefixed symbols, so C code keeps glibc malloc. Building it
# needs a C compiler, make and sh (README "Global allocator").
tokio = { version = "=1.53.2", default-features = false, features = ["rt-multi-thread", "net", "time", "io-util", "sync"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
tikv-jemallocator = { version = "=0.7.0", optional = true }

[build-dependencies]
# build.rs compiles src/musl_string.c for musl targets only; the version
# ring and tikv-jemalloc-sys already build with (no new crate).
cc = "=1.8.0"

# The static musl release (docs/RELEASING.md): jemalloc also provides the
# unprefixed malloc/free, so musl's own (slow) allocator serves nothing, not
# even libc-internal or C allocations. glibc builds keep prefixed symbols.
[target.'cfg(target_env = "musl")'.dependencies]
tikv-jemallocator = { version = "=0.7.0", optional = true, features = ["unprefixed_malloc_on_supported_platforms"] }

[features]
default = ["jemalloc"]
# `--no-default-features` builds with the system allocator (glibc malloc),
# e.g. for heaptrack/valgrind or a host without make.
jemalloc = ["dep:tikv-jemallocator"]

[dev-dependencies]
lzma-rust2 = { version = "=0.22.0", default-features = false, features = ["std", "optimization", "xz", "encoder"] }

[patch.crates-io]
starlark = { path = "vendor/starlark-0.14.2" }
# Same pinned parser; tab whitespace parity only (docs/STARLARK_VENDOR.md).
starlark_syntax = { path = "vendor/starlark_syntax-0.14.2" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[lints.rust]
unsafe_code = "deny"
