[package]
name = "bazel-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
description = "Experimental native Rust foundations for a Bazel-compatible build system"

[dependencies]
allocative = "=0.3.6"
anyhow = "1"
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
starlark = "=0.14.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[lints.rust]
unsafe_code = "deny"
