# Fast checks for pushes to and pull requests against main: formatting, clippy,
# the library unit tests and a hermetic subset of the integration tests
# (scripts/ci-integration-tests.txt: programs that need no network beyond
# loopback, no genuine Bazel and no machine-specific paths). The full gate
# (cargo test --locked, the Python validators, the release build) stays local:
# scripts/check.sh.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Debug info makes the test binaries large and the cache slow to restore.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: "1"

jobs:
  check:
    name: fmt, clippy, unit and hermetic integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain from rust-toolchain.toml
        # rustup is preinstalled on GitHub's Ubuntu images.
        run: |
          rustup toolchain install --no-self-update
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do rustup target add "$target"; done
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Scratch directories the tests expect
        # Several tests create their fixtures under /tmp/opencode; the Python
        # validators write reports under artifacts/.
        run: mkdir -p /tmp/opencode artifacts

      - name: cargo fmt
        run: |
          cargo fmt --all -- --check
          rustfmt --edition 2024 --check tests/support/*.rs

      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: zig (C compiler of the musl targets)
        run: scripts/setup-zig.sh

      - name: Check the static release targets (musl)
        run: python3 scripts/check_cross.py

      - name: Library unit tests
        run: cargo test --locked --lib

      - name: Hermetic integration tests
        run: |
          args=()
          while read -r name; do
            args+=(--test "$name")
          done < scripts/ci-integration-tests.txt
          cargo test --locked --no-fail-fast "${args[@]}"

      - name: Release tooling tests
        run: |
          python3 -m unittest discover -s tests -p test_release.py
          python3 -m unittest discover -s tests -p test_ci.py
          python3 -m unittest discover -s tests -p test_self_build.py

  self-build:
    name: Bazel self-build with the latest bazel-rs release
    # Dogfood (docs/SELF_BUILD.md): the latest published bazel-rs builds this
    # commit's //:bazel-rs with rules_rust, smoke-tests it and runs
    # `test //...`. Cargo stays the primary build; the comparison with genuine
    # Bazel stays local (scripts/self_build.py compare).
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Latest bazel-rs release
        # The newest release of this repository (pre-releases included; gh is
        # preinstalled, the job token only lifts the API rate limit), the
        # static x86_64 archive from its public download URL, checked against
        # its .sha256.
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName')
          stem="bazel-rs-${tag#v}-x86_64-unknown-linux-musl"
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag"
          dir="$RUNNER_TEMP/bazel-rs-release"
          rm -rf "$dir" && mkdir -p "$dir"
          for file in "$stem.tar.gz" "$stem.tar.gz.sha256"; do
            curl -fsSL --retry 3 -o "$dir/$file" "$url/$file"
          done
          (cd "$dir" && sha256sum -c "$stem.tar.gz.sha256" && tar xzf "$stem.tar.gz")
          echo "$dir/$stem" >> "$GITHUB_PATH"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          "$dir/$stem/bazel-rs" --version

      - name: Restore bazel-rs's cache
        # GitHub-hosted runners start empty: the cache of the same release
        # comes from actions/cache, saved by pushes to main only (pull
        # requests restore it but do not fill the repository's cache quota).
        uses: actions/cache/restore@v4
        with:
          # smoke/: the scratch directory, recreated by every run.
          path: |
            ~/.cache/bazel-rs/self-build
            !~/.cache/bazel-rs/self-build/smoke
          key: self-build-${{ steps.release.outputs.tag }}-${{ github.sha }}
          restore-keys: self-build-${{ steps.release.outputs.tag }}-

      - name: Build, smoke-test and test with bazel-rs
        env:
          BAZEL_RS_MAX_MEMORY_MB: "8192"
          BAZEL_RS_PROGRESS: "0"
        run: python3 scripts/self_build.py check --bazel bazel-rs --state-dir "$HOME/.cache/bazel-rs/self-build"

      - name: Save bazel-rs's cache
        if: github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          # smoke/: the scratch directory, recreated by every run.
          path: |
            ~/.cache/bazel-rs/self-build
            !~/.cache/bazel-rs/self-build/smoke
          key: self-build-${{ steps.release.outputs.tag }}-${{ github.sha }}
