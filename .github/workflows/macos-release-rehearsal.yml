# TEMPORARY (macos-port branch only; removed before merging): rehearses the
# release workflow's macos-arm64 build stage on a pull request — release.py
# --ci --dry-run --stage build for aarch64-apple-darwin (the tag checks fail
# in a dry run and are only reported) and the verify-macos checks on the
# archive it packaged.
name: macOS release rehearsal

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: macos-release-rehearsal-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  rehearse:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rust toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install --no-self-update
          rustup target add aarch64-apple-darwin
          rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v2-release-macos-arm64-rehearsal
          cache-on-failure: true

      - name: Build, smoke-test and package (dry run of the build stage)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["package"]["version"])')
          # Exit 1: done, but the (expected) tag preflight problems were
          # reported; 2: a failure.
          set +e
          python3 scripts/release.py --ci --dry-run --stage build --smoke-network \
            --target aarch64-apple-darwin --version "$version" --work-dir "$RUNNER_TEMP/release"
          rc=$?
          set -e
          test "$rc" -le 1
          ls -l "$RUNNER_TEMP/release/dist"

      - name: The verify-macos checks on the packaged archive
        run: |
          cd "$RUNNER_TEMP/release/dist"
          archive=$(ls bazel-rs-*-aarch64-apple-darwin.tar.gz)
          shasum -a 256 -c "$archive.sha256"
          mkdir -p "$RUNNER_TEMP/unpacked" && tar xzf "$archive" -C "$RUNNER_TEMP/unpacked"
          stem="${archive%.tar.gz}"
          codesign --verify --verbose "$RUNNER_TEMP/unpacked/$stem/bazel-rs"
          codesign --display --verbose=2 "$RUNNER_TEMP/unpacked/$stem/bazel-rs" 2>&1 | head -5
          otool -L "$RUNNER_TEMP/unpacked/$stem/bazel-rs"
          "$RUNNER_TEMP/unpacked/$stem/bazel-rs" --version
          cat "$(ls *.release.json)"
